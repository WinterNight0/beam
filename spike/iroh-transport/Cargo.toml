# Detached from the main workspace on purpose: a spike must not be able to
# change what the product builds.
[workspace]

[package]
name = "iroh-transport-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The real engine (now in beam-core), unmodified. If this prototype works,
# it works because the transport trait is honest about being just
# AsyncRead + AsyncWrite.
beam-core = { path = "../../crates/beam-core" }
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs"] }
anyhow = "1"

[profile.release]
strip = true
