[package]
name = "beam-gui"
description = "beam's desktop window: a front end on beam-core and beam-model, beside the CLI and the full-screen view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# PolyForm Strict 1.0.0, which has no SPDX id: the text is in LICENSE.md.
license-file = "../../LICENSE.md"
# Not for crates.io: the licence allows no redistribution. cargo-about
# leaves crates marked so out of THIRD-PARTY.html (ADR-0058).
publish = false

[lib]
name = "beam_gui"
path = "src/lib.rs"

[[bin]]
name = "beam-gui"
path = "src/main.rs"

[lints]
workspace = true

# The .exe's icon, built in on Windows only (ADR-0055).
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

# The core, the model and the GUI library: never the `beam` crate (the other
# front end) or a terminal library (ADR-0048, ADR-0049). `image` only turns
# on the PNG decoder iced's image widget uses (ADR-0054).
[dependencies]
beam-core.workspace = true
beam-model.workspace = true
iced.workspace = true
rfd.workspace = true
image.workspace = true

[dev-dependencies]
iced_test.workspace = true
tempfile.workspace = true
# Only for tests that run a real sender against the window's receiver.
tokio.workspace = true
