[package]
name = "beam"
description = "Identity-based peer-to-peer file transfer for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# PolyForm Strict 1.0.0, which has no SPDX id: the text is in LICENSE.md.
license-file = "../../LICENSE.md"
# Not for crates.io: the licence allows no redistribution. cargo-about
# leaves crates marked so out of THIRD-PARTY.html (ADR-0058).
publish = false

[lib]
name = "beam"
path = "src/lib.rs"

[[bin]]
name = "beam"
path = "src/main.rs"

[lints]
workspace = true

# The .exe's icon, built in on Windows only (ADR-0055).
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

# The front ends: the CLI and the full-screen view. Everything they share is
# in beam-core and beam-model (ADR-0048). Versions are set in the workspace Cargo.toml.
[dependencies]
beam-core.workspace = true
beam-model.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
# Tests dial and listen with iroh directly, to play a hostile or absent peer.
iroh.workspace = true
