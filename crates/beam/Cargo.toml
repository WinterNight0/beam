[package]
name = "beam"
description = "Direct peer-to-peer file transfer daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "beam"
path = "src/lib.rs"

[[bin]]
name = "beam"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
fs4 = "1.1.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "macros"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
zeroize = "1.9.0"
