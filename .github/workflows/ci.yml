name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A run is superseded as soon as a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository. Without this, the job token gets the
# repository's default permissions, which may include write access (ADR-0038).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to a full commit hash, not a tag: a tag can
# be moved to different code, a commit cannot. The comment says which release
# the hash is. To update, resolve the new tag with `git ls-remote` and replace
# both.
#
# Platforms (ADR-0046): Windows, and Arch Linux as the first Linux. Other
# distributions are added once beam is stable. Each platform is its own job,
# and one failing does not cancel the other: several of beam's rules (file
# permissions, path handling) differ by platform.
jobs:
  # GitHub has no Arch runner, so this runs in the official Arch image on a
  # GitHub Linux machine. The image is rolling on purpose: it tests what an
  # up-to-date Arch has. `base-devel` brings the C compiler `ring` needs.
  # Jobs in a container run as root, so no test may rely on file permissions
  # being enforced.
  arch:
    name: check (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed git rustup

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  windows:
    name: check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # Every dependency in Cargo.lock against the RustSec advisory database, on
  # every push, so a newly published vulnerability shows up without anyone
  # remembering to look. Unmaintained-crate notices are reported as warnings;
  # a vulnerability fails the job. See SECURITY.md. It reads only Cargo.lock,
  # so it is not a platform test and runs on GitHub's standard Linux image.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
