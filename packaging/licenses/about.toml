# cargo-about: the licences of the crates built into beam's Windows
# downloads (ADR-0058). scripts\windows\package.ps1 runs
#   cargo about generate -c packaging/licenses/about.toml packaging/licenses/about.hbs
# and puts the result, THIRD-PARTY.html, into the zip and the setup wizard.
#
# A crate under a licence not listed here stops the build: a new licence is
# looked at, and added here, on purpose.

targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
# beam and beam-gui themselves (publish = false): their licence is LICENSE.md.
private = { ignore = true }

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # attohttpc and option-ext, unmodified. MPL-2.0 asks that the source
    # stays available: each entry in THIRD-PARTY.html links to it.
    "MPL-2.0",
]
