[workspace]
resolver = "3"
# The layers, from the bottom up (ADR-0048): beam-core (core + actions),
# beam-model (what a screen shows), then the front ends: beam (CLI +
# full-screen view) and beam-gui (the desktop window, ADR-0049). A crate may
# only depend on the ones before it; the two front ends never use each other.
members = ["crates/beam-core", "crates/beam-model", "crates/beam", "crates/beam-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = ""

# Every version is chosen once, here, so two crates can never disagree. A
# crate names what it uses with `name.workspace = true`.
[workspace.dependencies]
beam-core = { path = "crates/beam-core" }
beam-model = { path = "crates/beam-model" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
fs4 = "1.1.0"
# Only `StreamExt`, to follow a connection's paths for the progress line.
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
hmac = "0.13.0"
# Pinned exactly, as iroh is: iced is not 1.0 and every minor release breaks
# its API. Upgrading is its own reviewed commit and short ADR. ADR-0049.
# `tokio`: the GUI's background work runs on the same runtime as the core.
iced = { version = "=0.14.0", features = ["tokio"] }
iced_test = "=0.14.0"
# Pinned exactly: iroh is the transport, and a minor bump changes how beam
# behaves on a network. Bumping it is its own reviewed commit. ADR-0025.
iroh = "=1.2.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Pinned exactly: a pre-release, chosen because it shares iroh's curve25519
# and sha2 versions. ADR-0026.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "macros", "signal"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
